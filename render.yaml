services:
  - type: web
    name: eyecare-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --workers=1 --threads=4 --timeout=120 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
