{% extends "base.html" %}
{% block title %}403 Access Denied - EyeCare AI{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 shadow-sm">
        <div class="text-danger mb-3">
          <i class="bi bi-shield-x fs-1 display-1"></i>
        </div>
        <h2 class="fw-bold mb-2">403 - Access Denied</h2>
        <p class="text-muted mb-4">You do not have permission to access this page or resource.</p>
        <div>
          <a href="{{ url_for('main.index') }}" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i> Return Home</a>
          <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary"><i class="bi bi-box-arrow-in-right me-1"></i> Switch Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
